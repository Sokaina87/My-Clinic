spring.application.name=auth-service
server.port=8085

spring.datasource.url=jdbc:h2:mem:auth_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Compte créé uniquement s'il n'existe pas encore. À remplacer en production
# via MEDIASSIST_ADMIN_EMAIL et MEDIASSIST_ADMIN_PASSWORD.
mediassist.admin.email=${MEDIASSIST_ADMIN_EMAIL:admin@mediassist.local}
mediassist.admin.password=${MEDIASSIST_ADMIN_PASSWORD:Admin123!}
