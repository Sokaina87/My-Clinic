<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MY CLINIC — Inscription et connexion</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Manrope:wght@700;800&display=swap');
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 10% 20%,#c6f6ec 0%,transparent 40%),radial-gradient(circle at 90% 80%,#d8e9ff 0%,transparent 40%),#f2f8f7;color:#0d2825;font-family:'Plus Jakarta Sans',sans-serif}
    .auth-card{width:min(640px,100%);padding:42px 56px;border:1px solid rgba(255,255,255,0.8);border-radius:36px;background:rgba(255,255,255,0.92);backdrop-filter:blur(20px);box-shadow:0 30px 70px rgba(12,68,61,0.14);animation:authRise 0.55s cubic-bezier(0.16,1,0.3,1) both}
    @keyframes authRise{from{opacity:0;transform:translateY(24px) scale(0.98)}to{opacity:1;transform:translateY(0) scale(1)}}
    .brand{display:flex;align-items:center;gap:12px;color:#08766c;font-size:12px;letter-spacing:1.8px;font-weight:800}
    .brand-mark{width:58px;height:64px;object-fit:contain;transition:transform 0.3s ease}
    .brand-mark:hover{transform:scale(1.06)}
    .eyebrow{display:block;margin-top:34px;color:#08766c;font-size:11.5px;letter-spacing:1.8px;font-weight:800}
    .auth-card h1{font:800 36px/1.2 Manrope;margin:12px 0 10px;letter-spacing:-1.3px}
    .auth-card>p{font-size:16px;color:#647573;margin:0 0 28px;line-height:1.5}
    .form{display:grid;gap:18px}
    .field label{display:block;font-weight:700;margin-bottom:8px;font-size:13px;color:#354d49}
    .field input,.field select{width:100%;height:52px;padding:13px 16px;border:1px solid #cce2de;border-radius:15px;background:#fbfefd;font:15px inherit;outline:none;transition:all 0.25s ease}
    .field input:focus,.field select:focus{border-color:#08766c;box-shadow:0 0 0 4px rgba(8,118,108,0.15);background:#ffffff}
    .submit{height:54px;border:0;border-radius:16px;background:linear-gradient(135deg,#08766c 0%,#055750 100%);color:#fff;font:800 15px 'Plus Jakarta Sans';cursor:pointer;box-shadow:0 8px 22px rgba(8,118,108,0.3);transition:all 0.28s ease}
    .submit:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(8,118,108,0.4);background:linear-gradient(135deg,#0a877c 0%,#06675e 100%)}
    .submit:active{transform:translateY(0)}
    .account-switch{margin:4px 0 0;text-align:center;color:#647573;font-size:14px}
    .account-switch button{padding:0;border:0;background:transparent;color:#08766c;font:800 14px 'Plus Jakarta Sans';cursor:pointer;text-decoration:underline;text-underline-offset:4px;transition:color 0.2s ease}
    .account-switch button:hover{color:#05524b}
    .register-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .register-grid .wide{grid-column:1/-1}
    .consent{display:flex;gap:10px;align-items:flex-start;color:#4f6763;font-size:12px;line-height:1.45}
    .consent input{margin-top:3px;accent-color:#08766c}
    .notice{margin-top:16px;padding:14px 16px;border-radius:14px;background:#e1f7f3;color:#0b685c;font-size:13.5px;box-shadow:0 4px 14px rgba(11,104,92,0.08);animation:authRise 0.3s ease}
    .notice.error{background:#fff0f1;color:#a42b3e}
    .hidden{display:none}
    @media(max-width:560px){.auth-card{padding:32px 24px;border-radius:28px}.auth-card h1{font-size:29px}.register-grid{grid-template-columns:1fr}.register-grid .wide{grid-column:auto}}
  </style>
</head>
<body>
  <main class="auth-card">
    <div class="brand"><img class="brand-mark" src="assets/my-clinic-logo.svg" alt="Logo MY CLINIC"> MY CLINIC</div>
    <span class="eyebrow" id="mode-label">ESPACE SÉCURISÉ</span>
    <h1 id="title">Bienvenue dans votre espace.</h1>
    <p id="subtitle">Connectez-vous pour accéder à vos outils de santé.</p>
    <form class="form" id="auth-form">
      <div class="register-only hidden register-grid">
        <div class="field"><label for="firstName">Prénom</label><input id="firstName" name="firstName" autocomplete="given-name"></div>
        <div class="field"><label for="lastName">Nom</label><input id="lastName" name="lastName" autocomplete="family-name"></div>
        <div class="field"><label for="birthDate">Date de naissance</label><input id="birthDate" name="birthDate" type="date"></div>
        <div class="field"><label for="gender">Sexe</label><select id="gender" name="gender"><option value="">Sélectionner</option><option value="FEMALE">Femme</option><option value="MALE">Homme</option></select></div>
        <div class="field"><label for="phone">Téléphone</label><input id="phone" name="phone" type="tel" autocomplete="tel"></div>
        <div class="field"><label for="emergencyContact">Contact d’urgence</label><input id="emergencyContact" name="emergencyContact" placeholder="Nom et téléphone"></div>
        <div class="field wide"><label for="address">Adresse</label><input id="address" name="address" autocomplete="street-address"></div>
        <label class="consent wide"><input id="consent" name="consent" type="checkbox"> <span>J’accepte la création de mon dossier patient et le traitement de ces données pour mon suivi de soins.</span></label>
      </div>
      <div class="field"><label for="email">Adresse e-mail</label><input id="email" name="email" type="email" autocomplete="email" required></div>
      <div class="field"><label for="password">Mot de passe</label><input id="password" name="password" type="password" minlength="8" autocomplete="current-password" required></div>
      <p class="account-switch" id="account-switch">Pas encore de compte ? <button type="button" id="switch-button">Inscription patient</button></p>
      <button class="submit" id="submit" type="submit">Se connecter →</button>
    </form>
    <div id="result" aria-live="polite"></div>
  </main>
  <script src="auth.js"></script>
</body>
</html>
