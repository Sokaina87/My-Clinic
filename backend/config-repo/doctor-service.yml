server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://localhost:5434/doctor_db
    username: mediassist_user
    password: mediassist_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
