server:
  port: 8085

spring:
  datasource:
    url: jdbc:postgresql://localhost:5437/auth_db
    username: mediassist_user
    password: mediassist_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
