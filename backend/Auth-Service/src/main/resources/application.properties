spring.application.name=auth-service
server.port=8085

spring.datasource.url=jdbc:postgresql://localhost:5437/auth_db
spring.datasource.username=mediassist_user
spring.datasource.password=mediassist_password
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.instance.prefer-ip-address=true

# Compte créé uniquement s'il n'existe pas encore. À remplacer en production
# via MEDIASSIST_ADMIN_EMAIL et MEDIASSIST_ADMIN_PASSWORD.
mediassist.admin.email=${MEDIASSIST_ADMIN_EMAIL:admin@mediassist.local}
mediassist.admin.password=${MEDIASSIST_ADMIN_PASSWORD:Admin123!}
