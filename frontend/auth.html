<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MediAssist — Inscription et connexion</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap');
    *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 20% 10%,#d6faf2,transparent 30%),#f4f9f8;color:#102c29;font-family:'DM Sans',sans-serif}.auth-card{width:min(650px,100%);padding:36px 56px;border:1px solid #d9ebe7;border-radius:32px;background:#fff;box-shadow:0 25px 60px #174c4420}.brand{display:flex;align-items:center;gap:13px;color:#82aaa4;font-size:12px;letter-spacing:1.8px}.brand-mark{display:grid;place-items:center;width:52px;height:52px;border-radius:17px;background:#59dcc9;color:#075c54;font-size:31px}.eyebrow{display:block;margin-top:36px;color:#679992;font-size:12px;letter-spacing:1.6px;font-weight:800}.auth-card h1{font:800 35px/1.25 Manrope;margin:13px 0 12px;letter-spacing:-1.4px}.auth-card>p{font-size:17px;color:#71817f;margin:0 0 25px}.form{display:grid;gap:18px}.field label{display:block;font-weight:700;margin-bottom:8px}.field input,.field select{width:100%;height:52px;padding:13px 15px;border:1px solid #cfe3df;border-radius:13px;background:#fbfefd;font:15px inherit;outline:none}.field input:focus,.field select:focus{border-color:#0b8a7d;box-shadow:0 0 0 4px #dff8f2}.submit{height:54px;border:0;border-radius:14px;background:#0b887b;color:#fff;font:800 15px 'DM Sans';cursor:pointer}.submit:hover{background:#076e64}.account-switch{margin:0;text-align:center;color:#71817f;font-size:14px}.account-switch button{padding:0;border:0;background:transparent;color:#087c70;font:700 14px 'DM Sans';cursor:pointer;text-decoration:underline;text-underline-offset:3px}.account-switch button:hover{color:#075c54}.register-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.register-grid .wide{grid-column:1/-1}.consent{display:flex;gap:9px;align-items:flex-start;color:#58706c;font-size:12px;line-height:1.4}.consent input{margin-top:2px}.notice{margin-top:15px;padding:12px 13px;border-radius:11px;background:#e5f8f3;color:#126d61;font-size:13px}.notice.error{background:#fff0f1;color:#a32c40}.hidden{display:none}@media(max-width:560px){.auth-card{padding:36px 25px;border-radius:24px}.auth-card h1{font-size:31px}.register-grid{grid-template-columns:1fr}.register-grid .wide{grid-column:auto}}
  </style>
</head>
<body>
  <main class="auth-card">
    <div class="brand"><span class="brand-mark">+</span> MEDIASSIST · AI HEALTHCARE</div>
    <span class="eyebrow" id="mode-label">ESPACE SÉCURISÉ</span>
    <h1 id="title">Bienvenue dans votre espace.</h1>
    <p id="subtitle">Connectez-vous pour accéder à vos outils de santé.</p>
    <form class="form" id="auth-form">
      <div class="register-only hidden register-grid">
        <div class="field"><label for="firstName">Prénom</label><input id="firstName" name="firstName" autocomplete="given-name"></div>
        <div class="field"><label for="lastName">Nom</label><input id="lastName" name="lastName" autocomplete="family-name"></div>
        <div class="field"><label for="birthDate">Date de naissance</label><input id="birthDate" name="birthDate" type="date"></div>
        <div class="field"><label for="gender">Sexe</label><select id="gender" name="gender"><option value="">Sélectionner</option><option value="FEMALE">Femme</option><option value="MALE">Homme</option></select></div>
        <div class="field"><label for="phone">Téléphone</label><input id="phone" name="phone" type="tel" autocomplete="tel"></div>
        <div class="field"><label for="emergencyContact">Contact d’urgence</label><input id="emergencyContact" name="emergencyContact" placeholder="Nom et téléphone"></div>
        <div class="field wide"><label for="address">Adresse</label><input id="address" name="address" autocomplete="street-address"></div>
        <label class="consent wide"><input id="consent" name="consent" type="checkbox"> <span>J’accepte la création de mon dossier patient et le traitement de ces données pour mon suivi de soins.</span></label>
      </div>
      <div class="field"><label for="email">Adresse e-mail</label><input id="email" name="email" type="email" autocomplete="email" required></div>
      <div class="field"><label for="password">Mot de passe</label><input id="password" name="password" type="password" minlength="8" autocomplete="current-password" required></div>
      <p class="account-switch" id="account-switch">Pas encore de compte ? <button type="button" id="switch-button">Inscription patient</button></p>
      <button class="submit" id="submit" type="submit">Se connecter →</button>
    </form>
    <div id="result" aria-live="polite"></div>
  </main>
  <script src="auth.js"></script>
</body>
</html>
